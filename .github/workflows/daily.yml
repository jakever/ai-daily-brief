name: AI Daily Brief

on:
  schedule:
    # 22:37 UTC ≈ 06:37 Asia/Shanghai 次日。GitHub cron 是 best-effort，整点最拥堵，
    # 故用非整点分钟并提前发车：即便被延迟 1-3h，仍能落在早晨送达。
    - cron: '37 22 * * *'
  workflow_dispatch:
    inputs:
      skip_send:
        description: "Skip Lark send (debug)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  daily:
    runs-on: ubuntu-latest
    # analyze 单次读超时 600s x 2 次重试 = 最坏 20min，加 fetch/send/pip 留余量。
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch sources
        run: python scripts/fetch_sources.py

      - name: Analyze with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        run: python scripts/analyze.py

      - name: Send to Lark
        if: ${{ inputs.skip_send != true }}
        env:
          LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
        run: python scripts/send_lark.py

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outputs-${{ github.run_id }}
          path: |
            raw.json
            digest.json
          retention-days: 7
          if-no-files-found: warn

      - name: Notify on failure
        if: failure()
        env:
          LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
        run: |
          curl -sS -X POST "$LARK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$(cat <<'EOF'
          {"msg_type":"text","content":{"text":"❌ AI 日报跑失败，查看 GitHub Actions 日志"}}
          EOF
          )"
